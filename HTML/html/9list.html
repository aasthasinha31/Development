<!--ul=unordered list , ol=ordered list-->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <!--unordered list-->
    <ul>
        <h1> <li> fruit names</li> </h1>
        <li> apple</li>
         <!--sub list-->
        <ul> red in colour,winter fruit </ul>
        <li> mango</li>
        <li> grapes </li>
        <li> guava</li>
    </ul> 

<!--ordered list-->
    <ol>
        <h1> <li> fruit names</li> </h1>
        <li> apple</li>
           <ol>
            <li>red in colour </li> 
            <li>  winter fruit </li>
            </ol>
        <li> mango</li>
        <li> grapes </li>
        <li> guava</li>
    </ol>
</body>
</html>
