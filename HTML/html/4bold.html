<!--B=BOLD,I=ITALIC,U=UNDERLINE-->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <b>hello</b>
    <br/> <!--used for writing in next line-->
    <i>hello</i>
    <br/>
    <u>hello</u>
    <br/>
    <p>i am <U>fine</U> </p>
    <br/>
    <!--sub = number written down . sup = number written upper-->
    <h3>h<sub>2</sub>o</h3>
    <br/>
    <h3>(A+B)<sup>2</sup></h3>
</body>
</html>
